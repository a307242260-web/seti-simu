.best-panel{background:linear-gradient(135deg,#f0f5ff,#f7f9fe);border:1px solid #d3e0f8;border-radius:14px;padding:16px 18px;margin:18px 0 26px}

@media(max-width:900px){.best-grid{grid-template-columns:1fr}}
footer{color:var(--muted);font-size:11.5px;margin-top:30px;border-top:1px solid var(--line);padding-top:12px}

const LABELS = {"player-blue":"蓝","player-green":"绿","player-brown":"棕","player-white":"白"};
const ORDER = ["player-blue","player-green","player-brown","player-white"];

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtMs(ms){if(ms==null)return "—";const s=ms/1000;if(s<60)return s.toFixed(1)+"s";const m=Math.floor(s/60);return m+"m"+(s-m*60).toFixed(0)+"s";}
function rel(p){return p?p.replace(/^reports\//,""):null;}
function scoreCell(r){
  if(!r) return "—";
  const cells=ORDER.map(k=>r.scores&&r.scores[k]!=null?`<b>${r.scores[k]}</b>`:"—").join(" / ");
  return `<span class="scores">${cells}</span><br><span class="src">${r.scoreSource==="save-final"?"完整终局 (save-final)":r.scoreSource==="roadmap"?"roadmap 文档":"记录口径 (record)"}</span>`;
}
function avgCell(r){return r&&r.avgScore!=null?r.avgScore.toFixed(2):"—";}
function stepsCell(r){return r?`${r.steps}${r.stepsLimit&&!r.terminal?` / ${r.stepsLimit}`:""}${r.terminal?" · 终局":""}`:"—";}
function timeCell(r){return r?fmtMs(r.wallMs):"—";}

// ---- 版本主结果：优先 save-final（完整终局分）的全盘记录，否则首个记录，否则 roadmap ----
function primaryResult(v){
  const full=v.results.filter(r=>!r.missingRecord&&r.mode==="full");
  if(full.length){
    const saveFinal=full.find(r=>r.scoreSource==="save-final");
    if(saveFinal) return {result:saveFinal,isRoadmap:false};
    return {result:full[0],isRoadmap:false};
  }
  if(v.results.some(r=>!r.missingRecord)) return {result:v.results.find(r=>!r.missingRecord),isRoadmap:false};
  return {result:null,isRoadmap:!!v.roadmap};
}

function bestGrid(){
  const b=REGISTRY.bestOf;
  const card=(label,value,sub,src,srcCls)=>
    `<div class="best-card"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div><span class="src ${srcCls||""}">${src}</span></div>`;
  const summaryOf=(x)=>{
    const v=REGISTRY.versions.find(vv=>vv.id===x.versionId);
    if(!v||!v.summary) return "";
    return v.summary.length>72?v.summary.slice(0,72)+"…":v.summary;
  };
  const runLine=(x)=>{
    const nm=esc(x.name);
    const hasId=nm.includes(x.versionId);
    return (hasId?nm:`${nm} <code>${x.versionId}</code>`)+(x.runKey?" · "+esc(x.runKey):"");
  };
  const html=[];
  if(b.bestWhite){
    html.push(card("最佳分数（白色）",b.bestWhite.value,
      `${runLine(b.bestWhite)}<br><span class="sum" title="${esc(summaryOf(b.bestWhite))}">${esc(summaryOf(b.bestWhite))||"（无改动摘要）"}</span>`,
      `来源 ${b.bestWhite.provenance}`, b.bestWhite.provenance==="roadmap"?"roadmap":""));
  } else html.push(card("最佳分数（白色）","—","尚无全盘记录","—"));
  if(b.bestAvg){
    html.push(card("最佳平均分数",b.bestAvg.value,
      `${runLine(b.bestAvg)}<br><span class="sum" title="${esc(summaryOf(b.bestAvg))}">${esc(summaryOf(b.bestAvg))||"（无改动摘要）"}</span>`,
      `来源 ${b.bestAvg.provenance}`, b.bestAvg.provenance==="roadmap"?"roadmap":""));
  } else html.push(card("最佳平均分数","—","尚无全盘记录","—"));
  // 搜索耗时卡：分两块——最佳分数的耗时 / 最佳均分的耗时（对应前两张卡）
  const timeLines=[];
  if(b.bestWhite){
    const t=b.bestWhite.wallMs!=null?`${fmtMs(b.bestWhite.wallMs)} · 每步约 ${b.bestWhite.msPerStep} ms`:'—（roadmap 无实测）';
    timeLines.push(`最佳分数（${esc(b.bestWhite.versionId)} · ${b.bestWhite.value}）：${t}`);
  }
  if(b.bestAvg){
    const t=b.bestAvg.wallMs!=null?`${fmtMs(b.bestAvg.wallMs)} · 每步约 ${b.bestAvg.msPerStep} ms`:'—（roadmap 无实测）';
    timeLines.push(`最佳均分（${esc(b.bestAvg.versionId)} · ${b.bestAvg.value}）：${t}`);
  }
  html.push(card("搜索耗时",
    b.bestAvg&&b.bestAvg.wallMs!=null?fmtMs(b.bestAvg.wallMs):null,
    timeLines.join("<br>")||"尚无运行",
    "全盘运行实测 (wallMs)"));
  document.getElementById("best-grid").innerHTML=html.join("");

  if(b.topByAvg&&b.topByAvg.length){
    const rows=b.topByAvg.map(x=>{
      const bp=x.bestPlayer?`${x.bestPlayer.color} ${x.bestPlayer.score}`:"—";
      return `<tr>
      <td><b>${esc(x.name)}</b> <code>${x.versionId}</code>${x.runKey?" · "+esc(x.runKey):""}</td>
      <td class="num"><b>${x.value.toFixed(2)}</b></td>
      <td class="num">${bp}</td>
      <td class="num">${x.steps??"—"}</td>
      <td class="num">${fmtMs(x.wallMs)}${x.msPerStep?`<br><span class="src">每步 ${x.msPerStep}ms</span>`:""}</td></tr>`;
    }).join("");
    document.getElementById("top3").innerHTML=`<h3>全盘最佳 Top3（按均分）</h3>
      <table><thead><tr><th>版本</th><th>均分</th><th>最高玩家</th><th>步数</th><th>耗时</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
}

// ---- 迭代表（只展示当前 baseline 一行；历史版本与回退/定位改动走命令行 review）----
function summaryCell(v){
  const s=v.summary||"";
  return s.length>110
    ? `<div class="summary-cell" title="${esc(s)}">${esc(s.slice(0,110)+"…")}</div>`
    : `<div class="summary-cell">${esc(s)}</div>`;
}
// 版本主行
function versionRow(v){
  const p=primaryResult(v);
  const r=p.result;
  const badges=[];
  if(v.isHead) badges.push('<span class="badge head">HEAD</span>');
  if(p.isRoadmap) badges.push('<span class="badge roadmap">roadmap</span>');
  const reportLink=r&&r.reportExists&&r.reportPath?`<a href="${rel(r.reportPath)}">复盘报告</a>`:(
    v.completeness.reportLinks&&v.completeness.reportLinks.length?`<a href="${rel(v.completeness.reportLinks[0].path)}">复盘报告</a>`:'<span class="src">—</span>');
  const rmap=v.roadmap;
  const summary=p.isRoadmap
    ? (rmap
      ? `<div class="summary-cell">${esc(v.summary)}<div class="src">roadmap：白 ${rmap.scores?rmap.scores["player-white"]:"—"} / 均 ${rmap.avgScore!=null?rmap.avgScore:"—"} / ${rmap.steps!=null?rmap.steps:"—"} 步</div></div>`
      : summaryCell(v))
    : summaryCell(v);
  return `<tr>
    <td><b>${esc(v.id)}</b><br><span class="src">${esc(v.name)}</span>${badges.join("")}</td>
    <td class="num">${esc(v.date)}</td>
    <td>${summary}</td>
    <td class="num">${p.isRoadmap?(v.roadmap?v.roadmap.steps??"—":"—"):stepsCell(r)}</td>
    <td>${p.isRoadmap?(v.roadmap?'<span class="scores">— / — / — / <b>'+(v.roadmap.scores? v.roadmap.scores["player-white"] ?? "—" : "—")+'</b></span><br><span class="src">roadmap 文档</span>':scoreCell(null)):scoreCell(r)}</td>
    <td class="num">${p.isRoadmap?(v.roadmap?v.roadmap.avgScore??"—":"—"):avgCell(r)}</td>
    <td class="num">${p.isRoadmap?"—":timeCell(r)}</td>
    <td>${reportLink}</td>
  </tr>`;
}

function iterTable(){
  const head=REGISTRY.versions.find(v=>v.isHead);
  const el=document.getElementById("iter-container");
  if(!head){ el.innerHTML='<p class="note">无已登记版本（node tools/robot_iterate.js register 登记）</p>'; return; }
  const thead=`<thead><tr>
    <th>版本</th><th>日期</th><th>改动摘要</th><th>步数</th><th>蓝 / 绿 / 棕 / 白</th><th>均分</th><th>耗时</th><th>复盘报告</th>
  </tr></thead>`;
  el.innerHTML=`<table>${thead}<tbody>${versionRow(head)}</tbody></table>`;
}

// ---- 初始化 ----
function init(){
  document.getElementById("board-name").textContent=REGISTRY.board.name||"";
  document.getElementById("board-seed").textContent=REGISTRY.board.seed||"";
  bestGrid();
  iterTable();
  const head=REGISTRY.versions.find(v=>v.isHead);
  document.getElementById("foot").innerHTML=
    `生成时间 ${esc(REGISTRY.builtAt)} · HEAD ${esc(REGISTRY.headCommit)}${REGISTRY.worktreeDirty?" · <span style='color:#b3261e'>工作树有未提交改动</span>":""}`+
    (head?` · 当前 HEAD 对应版本 <code>${esc(head.id)}</code>`:"")+
    `<br>数据源：<code>reports/iteration/versions.json</code>（人工维护） + <code>reports/research/*.json</code>（调研记录） → <code>reports/iteration/registry.json</code>（构建产物）。`;
}
